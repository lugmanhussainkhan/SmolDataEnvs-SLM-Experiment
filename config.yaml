model:
  name: anthropic/claude-haiku-5-5
  args:
    temperature: null
    top_p: null
    reasoning_effort: low
    cache_control: { type: ephemeral }
    max_tokens: 16000

data:
  dir: data

agent:
  max_turns: 12
  exec_timeout: 90
  tool_output_chars: 8000
  system_prompt: null

sandbox:
  mem_gb: 6
  threads: 1
  remote: []
  remote_slack: 600

run:
  concurrency: 32
  seed: 0

chain:
  - {
      name: train,
      data: { split: train },
      run: { trials: 1, out: runs/haiku55-train.json },
    }
